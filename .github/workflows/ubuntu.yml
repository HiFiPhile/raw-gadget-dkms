name: Ubuntu

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        ubuntu:
          - "24.04"
          - "26.04"

    container:
      image: ubuntu:${{ matrix.ubuntu }}

    steps:
      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            git \
            kmod \
            linux-headers-generic \
            shellcheck

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate scripts
        run: |
          sh -n install.sh uninstall.sh scripts/build-one.sh
          shellcheck install.sh uninstall.sh scripts/build-one.sh

      - name: Locate distribution kernel headers
        id: headers
        shell: bash
        run: |
          kernel_dir=$(
            find /usr/src -maxdepth 1 -type d \
              -name 'linux-headers-*-generic' -print |
              sort -V |
              tail -n 1
          )
          test -n "$kernel_dir"
          test -f "$kernel_dir/Makefile"
          echo "kernel_dir=$kernel_dir" >> "$GITHUB_OUTPUT"
          echo "Using $kernel_dir"

      - name: Build module
        run: ./scripts/build-one.sh "${{ steps.headers.outputs.kernel_dir }}"
